name: Release Docker Image

on:
  workflow_dispatch:
    inputs:
      update_latest:
        description: 'Also move the :latest tag to this build'
        required: false
        default: true
        type: boolean

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read package version
        id: pkg
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing droneblocks/dexi-node-red:$VERSION (update_latest=${{ inputs.update_latest }})"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PKG_VERSION=${{ steps.pkg.outputs.version }}
          tags: |
            droneblocks/dexi-node-red:${{ steps.pkg.outputs.version }}
            ${{ inputs.update_latest && 'droneblocks/dexi-node-red:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** droneblocks/dexi-node-red:${{ steps.pkg.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Also tagged latest:** ${{ inputs.update_latest }}" >> $GITHUB_STEP_SUMMARY
          echo "**Platforms:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
