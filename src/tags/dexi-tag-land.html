<script type="text/javascript">
    RED.nodes.registerType('dexi-tag-land', {
        category: 'DEXI tag nav',
        color: '#c7e9c0',
        defaults: {
            server: {type: "ros2-websocket-server"},
            name: {value: ""},
            tag: {value: 0, validate: RED.validators.number()},
            center: {value: true},
            onlyOffboard: {value: false}
        },
        // Dragged in from the palette: use the flow's ROS2 server so the node
        // works without opening it. Only fills an empty field.
        onadd: function () {
            var self = this;
            if (self.server) { return; }
            RED.nodes.eachConfig(function (c) {
                if (!self.server && c.type === 'ros2-websocket-server') {
                    self.server = c.id;
                    if (c.users.indexOf(self) < 0) { c.users.push(self); }
                }
            });
        },
        inputs: 1,
        outputs: 1,
        outputLabels: ["done"],
        icon: "font-awesome/fa-qrcode",
        paletteLabel: 'land on tag',
        label: function () { return this.name || (this.center === false ? 'land here' : 'land on tag ' + this.tag); }
    });
</script>

<script type="text/html" data-template-name="dexi-tag-land">
    <div class="form-row">
        <label for="node-input-server"><i class="fa fa-server"></i> ROS2 server</label>
        <input type="text" id="node-input-server">
    </div>
    <div class="form-row">
        <label for="node-input-tag"><i class="fa fa-qrcode"></i> Tag</label>
        <input type="number" id="node-input-tag" style="width:100px">
    </div>
    <div class="form-row">
        <label for="node-input-center"><i class="fa fa-crosshairs"></i> Center first</label>
        <input type="checkbox" id="node-input-center" style="width:auto"> center over the tag before landing
    </div>
    <div class="form-row">
        <label for="node-input-onlyOffboard"><i class="fa fa-user"></i> Failure path</label>
        <input type="checkbox" id="node-input-onlyOffboard" style="width:auto"> land only while the mission has the aircraft (Offboard)
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
</script>

<script type="text/html" data-help-name="dexi-tag-land">
    <p>Centers over the tag, then hands the landing to the flight controller.</p>
    <p>With "center first" off it lands where the aircraft is.</p>
    <p><b>Failure path</b>: tick it on the node a catch node feeds. A step also fails when the pilot takes over by leaving Offboard, and landing then would take the aircraft away from the pilot, so with this ticked the node lands only while the aircraft is still in Offboard.</p>
    <h3>Output</h3>
    <p>Sends the message on when the step finishes. If the step fails it raises an error
    instead (<code>msg.tagnav.message</code> says why): put one <b>catch</b> node on the tab and
    wire it to a <b>land on tag</b> node with "center first" off.</p>
</script>
