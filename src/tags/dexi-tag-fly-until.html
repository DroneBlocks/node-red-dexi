<script type="text/javascript">
    RED.nodes.registerType('dexi-tag-fly-until', {
        category: 'DEXI tag nav',
        color: '#c7e9c0',
        defaults: {
            server: {type: "ros2-websocket-server"},
            name: {value: ""},
            direction: {value: "forward"},
            speed: {value: 0.25, validate: RED.validators.number()},
            tag: {value: 1, validate: RED.validators.number()},
            timeout: {value: 20, validate: RED.validators.number()}
        },
        // Dragged in from the palette: use the flow's ROS2 server so the node
        // works without opening it. Only fills an empty field.
        onadd: function () {
            var self = this;
            if (self.server) { return; }
            RED.nodes.eachConfig(function (c) {
                if (!self.server && c.type === 'ros2-websocket-server') {
                    self.server = c.id;
                    if (c.users.indexOf(self) < 0) { c.users.push(self); }
                }
            });
        },
        inputs: 1,
        outputs: 1,
        outputLabels: ["done"],
        icon: "font-awesome/fa-qrcode",
        paletteLabel: 'fly until tag',
        label: function () { return this.name || 'fly ' + this.direction + ' until tag ' + this.tag; }
    });
</script>

<script type="text/html" data-template-name="dexi-tag-fly-until">
    <div class="form-row">
        <label for="node-input-server"><i class="fa fa-server"></i> ROS2 server</label>
        <input type="text" id="node-input-server">
    </div>
    <div class="form-row">
        <label for="node-input-direction"><i class="fa fa-arrows"></i> Direction</label>
        <select id="node-input-direction"><option>forward</option><option>backward</option><option>left</option><option>right</option></select>
    </div>
    <div class="form-row">
        <label for="node-input-speed"><i class="fa fa-tachometer"></i> Speed</label>
        <input type="number" id="node-input-speed" style="width:100px"> m/s (max 1)
    </div>
    <div class="form-row">
        <label for="node-input-tag"><i class="fa fa-qrcode"></i> Until tag</label>
        <input type="number" id="node-input-tag" style="width:100px">
    </div>
    <div class="form-row">
        <label for="node-input-timeout"><i class="fa fa-clock-o"></i> Give up after</label>
        <input type="number" id="node-input-timeout" style="width:100px"> s
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name">
    </div>
</script>

<script type="text/html" data-help-name="dexi-tag-fly-until">
    <p>Flies level in one direction until the tag is seen, then stops. Altitude is held.</p>
    <p>Keep transits slow: above about 0.3 m/s the detector can miss a tag in normal room light.
    There is no up or down: climbing until a tag appears has no ceiling indoors.</p>
    <h3>Output</h3>
    <p>Sends the message on when the step finishes. If the step fails it raises an error
    instead (<code>msg.tagnav.message</code> says why): put one <b>catch</b> node on the tab and
    wire it to a <b>land on tag</b> node with "center first" off.</p>
</script>
